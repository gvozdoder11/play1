<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#041016">
<title>Эволюция — Миры</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
    font-family:'Segoe UI',Arial,sans-serif;user-select:none;-webkit-user-select:none}
  html,body{width:100%;height:100%;overflow:hidden;background:#041016;color:#fff;
    touch-action:none;overscroll-behavior:none}

  .app{position:relative;width:100%;height:100%;display:flex;flex-direction:column;
    max-width:600px;margin:0 auto;padding:10px;z-index:10}

  /* ===== ФОН ===== */
  .world-bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;
    transition:background 1.5s ease}

  /* ОКЕАН */
  .world-bg.water{background:linear-gradient(180deg,#0a4d6e 0%,#062c44 25%,#031a2a 60%,#010a12 100%)}
  .world-bg.water::before{content:'';position:absolute;inset:0;
    background:radial-gradient(ellipse 60% 40% at 50% 0%,rgba(120,220,255,.35) 0%,transparent 70%);
    animation:lightShift 8s ease-in-out infinite}

  /* ОСТРОВ */
  .world-bg.earth{background:linear-gradient(180deg,#4a9fd4 0%,#6bc0e8 25%,#a0daf5 45%,#ffffff 55%,#ffffff 100%)}
  .world-bg.earth::before{content:'';position:absolute;
    top:42%;left:0;right:0;height:12%;
    background:linear-gradient(180deg,#00b8c8 0%,#00a0b0 40%,#008a99 70%,#006e7a 100%)}
  .world-bg.earth::after{content:'';position:absolute;
    top:53%;left:0;right:0;height:2px;background:rgba(255,255,255,.6);filter:blur(1px)}

  /* ГОРОД */
  .world-bg.city{background:linear-gradient(180deg,#1a2540 0%,#2a3a5c 20%,#3d4f75 45%,#5a4a70 70%,#2a1f3a 100%)}
  .world-bg.city::before{content:'';position:absolute;
    top:10%;right:15%;width:60px;height:60px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#fff8d0 0%,#e8dca0 60%,#a89860 100%);
    box-shadow:0 0 40px rgba(255,240,180,.6),0 0 80px rgba(255,240,180,.3)}
  .world-bg.city::after{content:'';position:absolute;
    top:0;left:0;right:0;height:50%;
    background-image:
      radial-gradient(1px 1px at 10% 15%,#fff,transparent),
      radial-gradient(1px 1px at 25% 8%,#fff,transparent),
      radial-gradient(1px 1px at 40% 20%,#fff,transparent),
      radial-gradient(1px 1px at 60% 12%,#fff,transparent),
      radial-gradient(1px 1px at 75% 25%,#fff,transparent),
      radial-gradient(1px 1px at 88% 5%,#fff,transparent);
    opacity:.8}
  .city-buildings{position:absolute;bottom:0;left:0;right:0;height:65%;
    background:linear-gradient(180deg,#0a1428 0%,#050a15 100%);
    clip-path:polygon(
      0% 100%,0% 55%,3% 55%,3% 40%,6% 40%,6% 60%,9% 60%,9% 25%,12% 25%,12% 45%,
      15% 45%,15% 55%,18% 55%,18% 35%,21% 35%,21% 50%,24% 50%,24% 20%,27% 20%,
      27% 45%,30% 45%,30% 60%,33% 60%,33% 30%,36% 30%,36% 50%,39% 50%,39% 15%,
      42% 15%,42% 40%,45% 40%,45% 55%,48% 55%,48% 25%,51% 25%,51% 50%,54% 50%,
      54% 35%,57% 35%,57% 55%,60% 55%,60% 20%,63% 20%,63% 45%,66% 45%,66% 30%,
      69% 30%,69% 55%,72% 55%,72% 40%,75% 40%,75% 25%,78% 25%,78% 50%,81% 50%,
      81% 60%,84% 60%,84% 35%,87% 35%,87% 45%,90% 45%,90% 55%,93% 55%,93% 30%,
      96% 30%,96% 50%,100% 50%,100% 100%)}
  .city-windows{position:absolute;bottom:0;left:0;right:0;height:65%;
    background-image:
      radial-gradient(circle 1.5px at 4% 45%,#ffe480,transparent),
      radial-gradient(circle 1.5px at 7% 50%,#ffe480,transparent),
      radial-gradient(circle 1.5px at 10% 30%,#ffe480,transparent),
      radial-gradient(circle 1.5px at 13% 42%,#ffe480,transparent),
      radial-gradient(circle 1.5px at 16% 48%,#ffe480,transparent),
      radial-gradient(circle 1.5px at 22% 28%,#ffe480,transparent),
      radial-gradient(circle 1.5px at 28% 40%,#ffe480,transparent),
      radial-gradient(circle 1.5px at 34% 22%,#ffe480,transparent),
      radial-gradient(circle 1.5px at 40% 30%,#ffe480,transparent),
      radial-gradient(circle 1.5px at 46% 45%,#ffe480,transparent),
      radial-gradient(circle 1.5px at 52% 28%,#ffe480,transparent),
      radial-gradient(circle 1.5px at 58% 42%,#ffe480,transparent),
      radial-gradient(circle 1.5px at 64% 25%,#ffe480,transparent),
      radial-gradient(circle 1.5px at 70% 38%,#ffe480,transparent),
      radial-gradient(circle 1.5px at 76% 22%,#ffe480,transparent),
      radial-gradient(circle 1.5px at 82% 40%,#ffe480,transparent),
      radial-gradient(circle 1.5px at 88% 30%,#ffe480,transparent),
      radial-gradient(circle 1.5px at 94% 45%,#ffe480,transparent);
    opacity:.7;mix-blend-mode:screen;animation:windowsTwinkle 4s ease-in-out infinite}
  @keyframes windowsTwinkle{0%,100%{opacity:.7}50%{opacity:.9}}
  .city-road{position:absolute;bottom:0;left:0;right:0;height:22%;
    background:linear-gradient(180deg,#1a1a24 0%,#0a0a10 100%)}
  .city-road::after{content:'';position:absolute;
    top:20%;left:10%;right:10%;height:2px;
    background:repeating-linear-gradient(90deg,#ffe480 0 20px,transparent 20px 40px);
    opacity:.5}
  .lamp{position:absolute;bottom:22%;width:3px;height:60px;
    background:linear-gradient(180deg,#3a3a4a,#1a1a2a);z-index:2}
  .lamp::after{content:'';position:absolute;bottom:-8px;left:50%;
    transform:translateX(-50%);width:20px;height:12px;
    background:radial-gradient(ellipse,rgba(255,220,100,.9) 0%,transparent 70%);
    filter:blur(2px)}
  .lamp.l1{left:18%;bottom:20%}
  .lamp.l2{right:18%;bottom:20%}
  .lamp.l3{left:50%;bottom:18%;transform:translateX(-50%)}

  /* ЛУНА + КОСМОС (для киборга) */
  .world-bg.moon-cosmos{
    background:
      radial-gradient(ellipse at 70% 15%, rgba(180,180,220,.25) 0%, transparent 45%),
      radial-gradient(ellipse at 20% 80%, rgba(120,80,200,.35) 0%, transparent 55%),
      linear-gradient(180deg,#0a0618 0%,#150a30 30%,#1a0d3d 55%,#0a0418 100%)}
  /* Звёздное небо */
  .moon-cosmos .stars{
    position:absolute;inset:0;
    background-image:
      radial-gradient(1.5px 1.5px at 8% 12%,#fff,transparent),
      radial-gradient(1px 1px at 22% 5%,#fff,transparent),
      radial-gradient(1.5px 1.5px at 45% 18%,#fff,transparent),
      radial-gradient(1px 1px at 62% 8%,#fff,transparent),
      radial-gradient(1.5px 1.5px at 78% 22%,#fff,transparent),
      radial-gradient(1px 1px at 92% 15%,#fff,transparent),
      radial-gradient(1px 1px at 15% 28%,#fff,transparent),
      radial-gradient(1.5px 1.5px at 55% 3%,#fff,transparent),
      radial-gradient(1px 1px at 35% 35%,#fff,transparent),
      radial-gradient(1px 1px at 85% 42%,#fff,transparent),
      radial-gradient(1.5px 1.5px at 12% 55%,#fff,transparent),
      radial-gradient(1px 1px at 70% 60%,#fff,transparent),
      radial-gradient(1px 1px at 40% 70%,#fff,transparent),
      radial-gradient(1.5px 1.5px at 90% 75%,#fff,transparent),
      radial-gradient(1px 1px at 5% 88%,#fff,transparent),
      radial-gradient(1px 1px at 60% 90%,#fff,transparent);
    animation:starsTwinkle 4s ease-in-out infinite}
  @keyframes starsTwinkle{0%,100%{opacity:.85}50%{opacity:1}}
  /* Луна большая */
  .moon-cosmos .moon-big{
    position:absolute;top:8%;right:8%;
    width:110px;height:110px;border-radius:50%;
    background:
      radial-gradient(circle at 30% 25%, #f5f5ff 0%, #d8d8ec 40%, #a0a0bc 75%, #707090 100%);
    box-shadow:
      0 0 60px rgba(200,200,255,.7),
      0 0 120px rgba(150,150,220,.4),
      inset -12px -12px 30px rgba(80,80,110,.7);
    animation:moonGlow 5s ease-in-out infinite}
  @keyframes moonGlow{
    0%,100%{box-shadow:0 0 60px rgba(200,200,255,.7),0 0 120px rgba(150,150,220,.4),inset -12px -12px 30px rgba(80,80,110,.7)}
    50%{box-shadow:0 0 80px rgba(200,200,255,.9),0 0 160px rgba(150,150,220,.5),inset -12px -12px 30px rgba(80,80,110,.7)}}
  /* Кратеры на луне */
  .moon-craters{
    position:absolute;border-radius:50%;
    background:radial-gradient(circle at 30% 30%, rgba(80,80,110,.9) 0%, rgba(50,50,80,.95) 100%);
    box-shadow:inset 2px 2px 4px rgba(40,40,60,.9)}
  /* Туманность */
  .nebula{
    position:absolute;bottom:0;left:0;right:0;height:60%;
    background:
      radial-gradient(ellipse at 30% 100%, rgba(120,60,220,.45) 0%, transparent 55%),
      radial-gradient(ellipse at 75% 100%, rgba(60,140,255,.35) 0%, transparent 55%),
      radial-gradient(ellipse at 50% 90%, rgba(200,80,180,.25) 0%, transparent 45%)}
  /* Маленькая планета на горизонте */
  .planet-small{
    position:absolute;bottom:8%;left:10%;
    width:70px;height:70px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #7b5cff 0%, #4520a0 60%, #1a0a40 100%);
    box-shadow:0 0 40px rgba(120,80,255,.7),inset -8px -8px 20px rgba(0,0,0,.6)}
  .planet-ring{
    position:absolute;bottom:6%;left:6%;
    width:80px;height:22px;border-radius:50%;
    border:2px solid rgba(180,150,255,.5);
    transform:rotate(-20deg);pointer-events:none}

  /* ПЛАНЕТА КСЕН (для инопланетянина) */
  .world-bg.alien{
    background:
      radial-gradient(ellipse at 50% 100%, rgba(60,180,90,.35) 0%, transparent 60%),
      linear-gradient(180deg,#0a2a15 0%,#061a0d 40%,#021008 70%,#010502 100%)}
  .world-bg.alien::before{content:'';position:absolute;inset:0;
    background:
      radial-gradient(circle at 15% 20%,rgba(100,255,100,.4) 0%,transparent 25%),
      radial-gradient(circle at 85% 30%,rgba(80,200,120,.35) 0%,transparent 30%),
      radial-gradient(circle at 50% 70%,rgba(60,180,100,.2) 0%,transparent 40%)}
  .alien-mushrooms{position:absolute;bottom:0;left:0;right:0;height:35%;
    background:
      radial-gradient(ellipse 8px 25px at 12% 90%,rgba(150,255,150,.7) 0%,transparent 100%),
      radial-gradient(ellipse 10px 35px at 25% 95%,rgba(100,255,180,.6) 0%,transparent 100%),
      radial-gradient(ellipse 7px 22px at 65% 92%,rgba(150,255,150,.7) 0%,transparent 100%),
      radial-gradient(ellipse 12px 30px at 82% 94%,rgba(120,255,160,.6) 0%,transparent 100%),
      radial-gradient(ellipse 9px 28px at 45% 96%,rgba(130,255,140,.65) 0%,transparent 100%)}
  .alien-planet{
    position:absolute;top:12%;left:70%;width:70px;height:70px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#9dff9d 0%,#3aa93a 60%,#0a3a0a 100%);
    box-shadow:0 0 60px rgba(120,255,120,.7)}
  /* Зелёная туманность сверху */
  .alien-mist{
    position:absolute;top:0;left:0;right:0;height:40%;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(100,255,150,.3) 0%, transparent 60%)}

  /* БОСС — ТЁМНАЯ ЗОНА */
  .world-bg.boss{
    background:
      radial-gradient(ellipse at 50% 20%, rgba(255,60,60,.35) 0%, transparent 50%),
      linear-gradient(180deg,#2a0505 0%,#150202 40%,#0a0101 70%,#030000 100%)}
  .world-bg.boss::before{content:'';position:absolute;inset:0;
    background:
      radial-gradient(circle at 50% 20%,rgba(255,60,60,.4) 0%,transparent 40%),
      radial-gradient(circle at 20% 60%,rgba(255,40,40,.25) 0%,transparent 40%),
      radial-gradient(circle at 80% 70%,rgba(255,80,40,.2) 0%,transparent 40%)}
  .world-bg.boss::after{content:'';position:absolute;inset:0;
    background:
      radial-gradient(circle at 30% 80%,rgba(255,0,0,.3) 0%,transparent 30%),
      radial-gradient(circle at 70% 30%,rgba(255,80,0,.25) 0%,transparent 30%);
    animation:bossPulse 2s ease-in-out infinite}
  @keyframes bossPulse{0%,100%{opacity:.7}50%{opacity:1}}
  .boss-ship{
    position:absolute;top:10%;left:50%;transform:translateX(-50%);
    width:120px;height:60px;
    background:radial-gradient(ellipse at 50% 30%,#a03030 0%,#501010 70%,#200505 100%);
    border-radius:50% 50% 20% 20%;
    box-shadow:0 0 60px rgba(255,60,60,.8),inset 0 -10px 20px rgba(0,0,0,.7)}
  .boss-ship::before{content:'';position:absolute;bottom:-15px;left:50%;transform:translateX(-50%);
    width:100%;height:15px;border-radius:50%;
    background:radial-gradient(ellipse,rgba(255,100,0,.9) 0%,rgba(255,0,0,.5) 50%,transparent 100%);
    animation:shipGlow 1s ease-in-out infinite}
  @keyframes shipGlow{0%,100%{opacity:.7;transform:translateX(-50%) scaleY(1)}
    50%{opacity:1;transform:translateX(-50%) scaleY(1.3)}}
  /* Красные звёзды */
  .boss-stars{
    position:absolute;inset:0;pointer-events:none;
    background-image:
      radial-gradient(1.5px 1.5px at 12% 15%,#ff6666,transparent),
      radial-gradient(1px 1px at 28% 8%,#ff8080,transparent),
      radial-gradient(1.5px 1.5px at 55% 22%,#ff5050,transparent),
      radial-gradient(1px 1px at 72% 5%,#ff7070,transparent),
      radial-gradient(1.5px 1.5px at 88% 18%,#ff6060,transparent),
      radial-gradient(1px 1px at 5% 42%,#ff7070,transparent),
      radial-gradient(1.5px 1.5px at 95% 38%,#ff5050,transparent),
      radial-gradient(1px 1px at 30% 55%,#ff6060,transparent);}

  /* БОЖЕСТВО */
  .world-bg.divine{background:linear-gradient(180deg,#fff9e6 0%,#ffe8a0 30%,#ffcc66 60%,#cc8800 100%)}
  .world-bg.divine::before{content:'';position:absolute;inset:0;
    background:
      radial-gradient(circle at 50% 30%,rgba(255,255,255,.9) 0%,transparent 30%),
      radial-gradient(circle at 20% 60%,rgba(255,240,180,.6) 0%,transparent 30%),
      radial-gradient(circle at 80% 50%,rgba(255,240,180,.6) 0%,transparent 30%)}

  .ray{position:absolute;top:-100px;width:80px;height:120vh;
    background:linear-gradient(180deg,rgba(255,255,240,.2) 0%,transparent 70%);
    transform-origin:top center;animation:rayMove 12s ease-in-out infinite;
    filter:blur(8px);pointer-events:none}
  .ray:nth-child(1){left:15%;animation-delay:0s;transform:rotate(-8deg)}
  .ray:nth-child(2){left:40%;animation-delay:-4s;transform:rotate(3deg);width:120px}
  .ray:nth-child(3){left:70%;animation-delay:-8s;transform:rotate(10deg);width:100px}
  @keyframes rayMove{0%,100%{opacity:.4}50%{opacity:.8}}
  @keyframes lightShift{0%,100%{opacity:.8;transform:translateX(-5%)}
    50%{opacity:1;transform:translateX(5%)}}

  .bubble{position:absolute;bottom:-50px;border-radius:50%;
    background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.8),rgba(200,220,255,.3) 40%,transparent 70%);
    border:1px solid rgba(200,240,255,.4);
    animation:bubbleUp linear infinite;opacity:.7}
  @keyframes bubbleUp{
    0%{transform:translateY(0) translateX(0) scale(.6);opacity:0}
    10%{opacity:.8}
    50%{transform:translateY(-50vh) translateX(20px) scale(1)}
    90%{opacity:.6}
    100%{transform:translateY(-110vh) translateX(-20px) scale(1.1);opacity:0}}

  .particle{position:absolute;pointer-events:none;
    animation:particleFloat linear infinite;opacity:.7;font-size:14px;z-index:5}
  @keyframes particleFloat{
    0%{transform:translateY(100vh) translateX(0) rotate(0deg);opacity:0}
    10%{opacity:.8}
    90%{opacity:.8}
    100%{transform:translateY(-20vh) translateX(50px) rotate(360deg);opacity:0}}

  .top{display:flex;justify-content:space-between;align-items:center;gap:6px;
    padding:10px 12px;background:rgba(5,25,45,.75);backdrop-filter:blur(12px);
    border-radius:14px;border:1px solid rgba(100,200,255,.35);flex-shrink:0;
    box-shadow:0 4px 20px rgba(0,150,200,.2)}
  .res{font-size:10px;color:#a8c8e0;text-transform:uppercase;letter-spacing:1px;
    flex:1;text-align:center}
  .res b{display:block;font-size:16px;color:#fff;margin-top:2px;font-weight:900;
    text-shadow:0 0 10px rgba(100,200,255,.5)}
  .res b.gold{color:#ffcc00;text-shadow:0 0 10px rgba(255,204,0,.6)}

  .evolution-bar{flex-shrink:0;margin-top:8px;
    background:rgba(5,25,45,.85);backdrop-filter:blur(12px);
    border-radius:14px;border:1px solid rgba(100,200,255,.5);
    padding:10px 14px;box-shadow:0 4px 20px rgba(0,150,200,.3);
    position:relative;overflow:hidden}
  .evolution-bar::before{content:'';position:absolute;inset:0;
    background:linear-gradient(90deg,transparent,rgba(100,220,255,.1),transparent);
    animation:shimmer 2.5s infinite;pointer-events:none}
  @keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
  .evo-header{display:flex;justify-content:space-between;align-items:center;
    margin-bottom:8px;font-size:11px;color:#a8c8e0;
    text-transform:uppercase;letter-spacing:1px;font-weight:800;position:relative;z-index:1}
  .evo-header .stage-name{color:#5fd4ff;font-size:12px;
    text-shadow:0 0 10px rgba(100,220,255,.6)}
  .evo-header .next-name{color:#ffcc00;font-size:11px;
    text-shadow:0 0 10px rgba(255,204,0,.5)}
  .evo-header .timer{color:#ff6b6b;font-size:13px;font-weight:900;
    text-shadow:0 0 10px rgba(255,100,100,.8)}
  .evo-track{height:18px;background:rgba(0,10,20,.8);border-radius:10px;
    overflow:hidden;position:relative;
    border:1px solid rgba(100,200,255,.3);z-index:1}
  .evo-fill{height:100%;border-radius:10px;
    background:linear-gradient(90deg,#00d9ff,#00ff88,#ffcc00);
    transition:width .25s ease-out;
    box-shadow:0 0 20px rgba(0,255,136,.6);position:relative;width:0%}
  .evo-fill::after{content:'';position:absolute;inset:0;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);
    animation:shine 2s infinite}
  @keyframes shine{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
  .evo-text{position:absolute;inset:0;display:flex;align-items:center;
    justify-content:center;font-size:11px;font-weight:900;color:#fff;
    text-shadow:0 1px 3px rgba(0,0,0,.9);z-index:2;pointer-events:none}

  .evolution-zone{flex:1;position:relative;display:flex;align-items:center;
    justify-content:center;min-height:0;padding:20px;overflow:hidden}
  .main-creature{position:absolute;top:50%;left:50%;
    width:200px;height:200px;cursor:pointer;z-index:15;
    transform:translate(-50%,-50%);
    transition:width .4s ease-out,height .4s ease-out;
    animation:breathe 3.5s ease-in-out infinite;
    filter:drop-shadow(0 10px 25px rgba(0,0,0,.5))}
  .main-creature svg{width:100%;height:100%;display:block;pointer-events:none}
  @keyframes breathe{0%,100%{transform:translate(-50%,-50%) scale(1)}
    50%{transform:translate(-50%,-50%) scale(1.06)}}
  .creature-name{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);
    background:rgba(5,25,45,.9);border:1px solid rgba(100,200,255,.6);
    padding:6px 18px;border-radius:20px;font-size:13px;font-weight:800;
    color:#fff;white-space:nowrap;z-index:20;backdrop-filter:blur(8px);
    text-shadow:0 0 12px rgba(100,220,255,.8)}

  .combo-indicator{position:absolute;top:20px;left:50%;transform:translateX(-50%);
    background:linear-gradient(90deg,#ff6b00,#ffcc00);color:#1a0b00;
    padding:6px 18px;border-radius:20px;font-weight:900;font-size:14px;
    z-index:25;opacity:0;transition:opacity .3s;pointer-events:none;
    box-shadow:0 0 30px rgba(255,150,0,.7)}
  .combo-indicator.active{opacity:1;animation:comboPulse .5s infinite}
  @keyframes comboPulse{0%,100%{transform:translateX(-50%) scale(1)}
    50%{transform:translateX(-50%) scale(1.08)}}
  .big-bonus{position:absolute;font-size:36px;font-weight:900;color:#ff3b9a;
    pointer-events:none;z-index:30;text-shadow:0 0 30px rgba(255,59,154,.9);
    animation:bigBonusAnim 1.2s ease-out forwards}
  @keyframes bigBonusAnim{
    0%{transform:translate(-50%,-50%) scale(.3) rotate(0deg);opacity:0}
    20%{transform:translate(-50%,-70%) scale(1.5) rotate(-10deg);opacity:1}
    100%{transform:translate(-50%,-250%) scale(1) rotate(20deg);opacity:0}}
  .flash{position:absolute;font-size:22px;font-weight:900;color:#ffcc00;
    pointer-events:none;z-index:30;text-shadow:0 0 20px rgba(255,204,0,.9);
    animation:floatUp .8s ease-out forwards}
  @keyframes floatUp{0%{transform:translate(-50%,-50%) scale(.5);opacity:0}
    20%{transform:translate(-50%,-70%) scale(1.3);opacity:1}
    100%{transform:translate(-50%,-200%) scale(1);opacity:0}}
  .click-bubble{position:absolute;width:20px;height:20px;border-radius:50%;
    background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.9),rgba(150,220,255,.3));
    border:1px solid rgba(200,240,255,.6);pointer-events:none;z-index:12;
    animation:clickBubbleUp 1s ease-out forwards}
  @keyframes clickBubbleUp{
    0%{transform:translate(-50%,-50%) scale(.3);opacity:1}
    100%{transform:translate(-50%,-300%) scale(1.5);opacity:0}}

  {id:'blessing', emoji:'🌟', text:'Благословение!',    good:true,  action:() => { S.blessingUntil = Date.now() + 15000; return 'x2 клик 15 сек'; }},
  {id:'treasure', emoji:'🎁', text:'Клад!',             good:true,  action:() => { const gain = Math.max(200, cps()*60); S.dna += gain; S.totalDna += gain; return `+${fmt(gain)} ДНК`; }},
  {id:'mutation', emoji:'🦠', text:'Мутация!',          good:true,  action:() => { S.evolutionBonus = 0.5; return 'Скидка 50%'; }},
  {id:'ice',      emoji:'🧊', text:'Ледниковый период', good:false, action:() => { S.frozenUntil = Date.now() + 10000; return 'Генераторы -50%'; }},
  {id:'luck',     emoji:'🍀', text:'Удача!',            good:true,  action:() => { S.timeLeft += 30; return '+30 сек'; }},
];

const SAVE_KEY = 'evolution_save_v3';

let S = {
  dna: 0, crystals: 0, totalDna: 0, stage: 0,
  mut: {}, gen: {}, crystalShop: {}, collection: {},
  clickMultiplier: 1, lastOnline: Date.now(),
  timeLeft: 60, evolutionBonus: 0,
  blessingUntil: 0, frozenUntil: 0,
  combo: 0, lastClickTime: 0, currentWorld: 'water',
  adsWatched: 0,
  lastAdStage: 0,
};

function initState() {
  MUTATIONS.forEach(m => { if (typeof S.mut[m.id] !== 'number') S.mut[m.id] = 0; });
  GENERATORS.forEach(g => { if (typeof S.gen[g.id] !== 'number') S.gen[g.id] = 0; });
  CRYSTAL_SHOP.forEach(i => { if (typeof S.crystalShop[i.id] !== 'number') S.crystalShop[i.id] = 0; });
  if (!S.lastOnline) S.lastOnline = Date.now();
  if (typeof S.timeLeft !== 'number') S.timeLeft = getStage().time;
  if (typeof S.combo !== 'number') S.combo = 0;
  if (typeof S.adsWatched !== 'number') S.adsWatched = 0;
  if (typeof S.lastAdStage !== 'number') S.lastAdStage = 0;
}

function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) Object.assign(S, JSON.parse(raw));
  } catch(e) {}
  initState();
}
function writeSave() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch(e) {}
}
function resetGameState() {
  S = {
    dna: 0, crystals: 0, totalDna: 0, stage: 0,
    mut: {}, gen: {}, crystalShop: {}, collection: {},
    clickMultiplier: 1, lastOnline: Date.now(),
    timeLeft: 60, evolutionBonus: 0,
    blessingUntil: 0, frozenUntil: 0,
    combo: 0, lastClickTime: 0, currentWorld: 'water',
    adsWatched: 0, lastAdStage: 0,
  };
  MUTATIONS.forEach(m => S.mut[m.id] = 0);
  GENERATORS.forEach(g => S.gen[g.id] = 0);
  CRYSTAL_SHOP.forEach(item => S.crystalShop[item.id] = 0);
}

function fmt(n) {
  if (n < 1000) return Math.floor(n).toString();
  const units = ['','K','M','B','T','Qa','Qi'];
  const i = Math.min(Math.floor(Math.log10(n)/3), units.length-1);
  const v = n / Math.pow(1000, i);
  return v.toFixed(v < 10 ? 2 : v < 100 ? 1 : 0) + units[i];
}

function permClickMult() { let m = 1; CRYSTAL_SHOP.forEach(i => { if (i.effect === 'clickMult') m += (S.crystalShop[i.id]||0) * i.value; }); return m; }
function permAutoMult()  { let m = 1; CRYSTAL_SHOP.forEach(i => { if (i.effect === 'autoMult') m += (S.crystalShop[i.id]||0) * i.value; }); return m; }
function permStartDna()  { let d = 0; CRYSTAL_SHOP.forEach(i => { if (i.effect === 'startDna') d += (S.crystalShop[i.id]||0) * i.value; }); return d; }
function permKeepMut()   { let n = 0; CRYSTAL_SHOP.forEach(i => { if (i.effect === 'keepMut') n += (S.crystalShop[i.id]||0) * i.value; }); return Math.min(n, MUTATIONS.length); }
function permExtraTime() { let t = 0; CRYSTAL_SHOP.forEach(i => { if (i.effect === 'extraTime') t += (S.crystalShop[i.id]||0) * i.value; }); return t; }

function clickPower() {
  let base = 1;
  MUTATIONS.forEach(m => base += (S.mut[m.id] || 0) * m.effect);
  let mult = S.clickMultiplier * permClickMult();
  if (S.combo >= 50) mult *= 5;
  else if (S.combo >= 20) mult *= 3;
  else if (S.combo >= 10) mult *= 2;
  if (Date.now() < S.blessingUntil) mult *= 2;
  return base * mult;
}
function cps() {
  let base = 0;
  GENERATORS.forEach(g => base += (S.gen[g.id] || 0) * g.cps);
  let mult = S.clickMultiplier * permAutoMult();
  if (Date.now() < S.frozenUntil) mult *= 0.5;
  return base * mult;
}
function mutationCost(m) { return Math.floor(m.base * Math.pow(m.mult, S.mut[m.id] || 0)); }
function generatorCost(g) { return Math.floor(g.base * Math.pow(g.mult, S.gen[g.id] || 0)); }
function getStage() { return STAGES[Math.min(S.stage, STAGES.length-1)]; }
function nextStage() { return STAGES[Math.min(S.stage+1, STAGES.length-1)]; }

function evolutionProgress() {
  const next = nextStage();
  if (next.need === Infinity) return 100;
  let need = next.need;
  if (S.evolutionBonus > 0) need *= (1 - S.evolutionBonus);
  return Math.min(100, (S.totalDna / need) * 100);
}
function creatureScale() { return 0.7 + (evolutionProgress() / 100) * 0.6; }

function checkForcedAd() {
  const stagesSinceAd = S.stage - S.lastAdStage;
  if (stagesSinceAd >= 3 && S.stage > 0) {
    adv.showRewardedVideo({
      callbacks: {
        onClose: () => {
          S.lastAdStage = S.stage;
          writeSave();
        }
      }
    });
  }
}

function buyMutation(id) {
  const m = MUTATIONS.find(x => x.id === id); if (!m) return;
  const lvl = S.mut[id] || 0;
  if (lvl >= m.maxLevel) { toast('✅ Максимум', 'green'); return; }
  const cost = mutationCost(m);
  if (S.dna < cost) { toast('❌ Нужно ' + fmt(cost) + ' ДНК', 'red'); return; }
  S.dna -= cost;
  S.mut[m.id] = lvl + 1;
  toast('✅ ' + m.name + ' ур. ' + S.mut[m.id] + '/' + m.maxLevel, 'green');
  updateStats(); updateListStates(); writeSave();
}
function buyGenerator(id) {
  const g = GENERATORS.find(x => x.id === id); if (!g) return;
  const lvl = S.gen[id] || 0;
  if (lvl >= g.maxLevel) { toast('✅ Максимум', 'green'); return; }
  const cost = generatorCost(g);
  if (S.dna < cost) { toast('❌ Нужно ' + fmt(cost) + ' ДНК', 'red'); return; }
  S.dna -= cost;
  S.gen[g.id] = lvl + 1;
  toast('✅ ' + g.name + ' ур. ' + S.gen[g.id] + '/' + g.maxLevel, 'green');
  updateStats(); updateListStates(); writeSave();
}
function buyCrystalBonus(id) {
  const item = CRYSTAL_SHOP.find(x => x.id === id); if (!item) return;
  const lvl = S.crystalShop[item.id] || 0;
  if (lvl >= item.maxLevel) { toast('✅ Максимум', 'green'); return; }
  const cost = item.baseCost * (lvl + 1);
  if (S.crystals < cost) { toast('💎 Нужно ' + cost + ' кристаллов', 'red'); return; }
  S.crystals -= cost;
  S.crystalShop[item.id] = lvl + 1;
  toast('✅ ' + item.name + ' ур. ' + (lvl + 1), 'green');
  updateStats(); updateListStates(); writeSave();
}

function watchAd() {
  adv.showRewardedVideo({
    callbacks: {
      onRewarded: () => {
        S.timeLeft += 30;
        S.crystals += 3;
        S.adsWatched++;
        toast('📺 +30 сек и +3 💎', 'gold');
        updateStats(); updateEvolutionBar(); writeSave();
      }
    }
  });
}

function askEvolve() {
  const next = nextStage();
  if (next.need === Infinity) { toast('🏆 Финальная стадия!', 'gold'); return; }
  let need = next.need;
  if (S.evolutionBonus > 0) need *= (1 - S.evolutionBonus);
  if (S.totalDna < need) { toast('Нужно ' + fmt(need) + ' ДНК', 'red'); return; }
  S.stage++;
  S.totalDna = 0;
  S.evolutionBonus = 0;
  S.collection[S.stage] = (S.collection[S.stage] || 0) + 1;
  S.timeLeft = next.time || 0;
  const startBonus = permStartDna();
  S.dna = startBonus;
  if (startBonus > 0) S.totalDna += startBonus;
  const keepCount = permKeepMut();
  const mutsSorted = MUTATIONS.map(m => ({ id: m.id, lvl: S.mut[m.id] || 0 }))
    .sort((a, b) => b.lvl - a.lvl).slice(0, keepCount);
  MUTATIONS.forEach(m => S.mut[m.id] = 0);
  GENERATORS.forEach(g => S.gen[g.id] = 0);
  mutsSorted.forEach(({ id, lvl }) => { if (lvl > 0) S.mut[id] = lvl; });
  S.clickMultiplier = 1 + S.stage * 0.5;

  const world = WORLDS[next.world];
  let msg = 'Ты стал: ' + next.name + '\nМир: ' + world.emoji + ' ' + world.name + '\nМножитель x' + (1 + S.stage * 0.5).toFixed(1);
  if (startBonus > 0) msg += '\n\n🚀 Старт: +' + fmt(startBonus) + ' ДНК';
  const kept = mutsSorted.filter(m => m.lvl > 0).length;
  if (kept > 0) msg += '\n🔮 Сохранено мутаций: ' + kept;
  showModal(next.shape, next.color, '🌍 Новая стадия!', msg);
  const mainEl = document.querySelector('.main-creature');
  if (mainEl) mainEl.dataset.stage = '-1';
  updateStats(); updateEvolutionBar(); renderList(); applyWorld(next.world); writeSave();

  checkForcedAd();
}

function doClick(clientX, clientY) {
  const now = Date.now();
  if (now - S.lastClickTime < 800) S.combo++;
  else S.combo = 1;
  S.lastClickTime = now;
  const gain = clickPower();
  S.dna += gain;
  S.totalDna += gain;
  const zone = document.getElementById('evolutionZone');
  const rect = zone.getBoundingClientRect();
  spawnFlash(clientX - rect.left, clientY - rect.top, gain);
  spawnClickBubble(clientX - rect.left, clientY - rect.top);
  if (Math.random() < 0.05) {
    spawnBigBonus(clientX - rect.left, clientY - rect.top);
    if (Math.random() < 0.5) { S.blessingUntil = Date.now() + 10000; toast('🌟 x2 клик 10 сек!', 'gold'); }
    else { S.timeLeft += 15; toast('⏱ +15 секунд!', 'gold'); }
  }
  if (navigator.vibrate) navigator.vibrate(6);
  updateStats(); updateEvolutionBar(); updateCombo();
  scheduleSave();
}

function spawnFlash(x, y, gain) {
  const zone = document.getElementById('evolutionZone');
  const el = document.createElement('div');
  el.className = 'flash';
  el.textContent = '+' + fmt(gain);
  el.style.left = x + 'px'; el.style.top = y + 'px';
  zone.appendChild(el);
  setTimeout(() => el.remove(), 800);
}
function spawnClickBubble(x, y) {
  const zone = document.getElementById('evolutionZone');
  const el = document.createElement('div');
  el.className = 'click-bubble';
  el.style.left = x + 'px'; el.style.top = y + 'px';
  zone.appendChild(el);
  setTimeout(() => el.remove(), 1000);
}
function spawnBigBonus(x, y) {
  const zone = document.getElementById('evolutionZone');
  const el = document.createElement('div');
  el.className = 'big-bonus';
  el.textContent = '✨ БОНУС!';
  el.style.left = x + 'px'; el.style.top = y + 'px';
  zone.appendChild(el);
  setTimeout(() => el.remove(), 1200);
}
function updateCombo() {
  const el = document.getElementById('comboInd');
  if (S.combo >= 10) {
    let mult = 2;
    if (S.combo >= 50) mult = 5;
    else if (S.combo >= 20) mult = 3;
    el.textContent = `🔥 x${mult} КОМБО (${S.combo})`;
    el.classList.add('active');
  } else el.classList.remove('active');
}

let currentTab = 'mutations';
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(el => {
    el.classList.toggle('active', el.dataset.tab === tab);
  });
  renderList();
}

function renderList() {
  const list = document.getElementById('list');
  let html = '';
  if (currentTab === 'shop') {
    html = CRYSTAL_SHOP.map(item => {
      const lvl = S.crystalShop[item.id] || 0;
      const maxed = lvl >= item.maxLevel;
      const cost = item.baseCost * (lvl + 1);
      const canBuy = !maxed && S.crystals >= cost;
      const cls = maxed ? 'maxed' : (canBuy ? '' : 'locked');
      return `<div class="item ${cls}" data-buy="crystal:${item.id}">
        <div class="emoji">${item.emoji}</div>
        <div class="info">
          <div class="name">${item.name}</div>
          <div class="desc">${item.desc}</div>
          <div class="lvl" data-lvl>Ур. ${lvl} / ${item.maxLevel}</div>
        </div>
        <div class="cost">
          <div class="price" data-cost>${maxed ? '✅ МАКС' : cost + ' 💎'}</div>
          <div class="have" data-have>${maxed ? '' : (canBuy ? '✓ КУПИТЬ' : '🔒')}</div>
        </div>
      </div>`;
    }).join('');
  } else if (currentTab === 'collection') {
    html = STAGES.map((st, i) => {
      const unlocked = i <= S.stage || (S.collection[i] || 0) > 0;
      const world = WORLDS[st.world];
      return `<div class="item ${unlocked ? '' : 'locked'}">
        <div class="emoji">${unlocked ? world.emoji : '🔒'}</div>
        <div class="info">
          <div class="name">${st.name}</div>
          <div class="desc">${unlocked ? world.emoji + ' ' + world.name : 'Не открыто'}</div>
        </div>
        <div class="cost"><div class="price">Ур. ${i}</div></div>
      </div>`;
    }).join('');
  } else {
    const data = currentTab === 'mutations' ? MUTATIONS : GENERATORS;
    const stateObj = currentTab === 'mutations' ? S.mut : S.gen;
    const costFn = currentTab === 'mutations' ? mutationCost : generatorCost;
    const prefix = currentTab === 'mutations' ? 'mut' : 'gen';
    html = data.map(item => {
      const lvl = stateObj[item.id] || 0;
      const maxed = lvl >= item.maxLevel;
      const cost = costFn(item);
      const canBuy = !maxed && S.dna >= cost;
      const cls = maxed ? 'maxed' : (canBuy ? '' : 'locked');
      return `<div class="item ${cls}" data-buy="${prefix}:${item.id}">
        <div class="emoji">${item.emoji}</div>
        <div class="info">
          <div class="name">${item.name}</div>
          <div class="desc">${item.desc}</div>
          <div class="lvl" data-lvl>Ур. ${lvl} / ${item.maxLevel}</div>
        </div>
        <div class="cost">
          <div class="price" data-cost>${maxed ? '✅ МАКС' : fmt(cost) + ' 🧬'}</div>
          <div class="have" data-have>${maxed ? '⭐ МАКС' : (canBuy ? '✓ КУПИТЬ' : '🔒')}</div>
        </div>
      </div>`;
    }).join('');
  }
  list.innerHTML = html;
}

function updateListStates() {
  const list = document.getElementById('list');
  const items = list.querySelectorAll('.item[data-buy]');
  items.forEach(el => {
    const [type, id] = el.dataset.buy.split(':');
    let cost, canBuy, lvlText = '', maxed = false;
    if (type === 'mut') {
      const m = MUTATIONS.find(x => x.id === id); if (!m) return;
      const lvl = S.mut[id] || 0;
      maxed = lvl >= m.maxLevel;
      cost = mutationCost(m);
      canBuy = !maxed && S.dna >= cost;
      lvlText = 'Ур. ' + lvl + ' / ' + m.maxLevel;
    } else if (type === 'gen') {
      const g = GENERATORS.find(x => x.id === id); if (!g) return;
      const lvl = S.gen[id] || 0;
      maxed = lvl >= g.maxLevel;
      cost = generatorCost(g);
      canBuy = !maxed && S.dna >= cost;
      lvlText = 'Ур. ' + lvl + ' / ' + g.maxLevel;
    } else if (type === 'crystal') {
      const item = CRYSTAL_SHOP.find(x => x.id === id); if (!item) return;
      const lvl = S.crystalShop[id] || 0;
      maxed = lvl >= item.maxLevel;
      cost = item.baseCost * (lvl + 1);
      canBuy = !maxed && S.crystals >= cost;
      lvlText = 'Ур. ' + lvl + ' / ' + item.maxLevel;
    }
    el.classList.toggle('maxed', maxed);
    el.classList.toggle('locked', !maxed && !canBuy);
    const costEl = el.querySelector('[data-cost]');
    if (costEl) costEl.textContent = maxed ? '✅ МАКС' : (type === 'crystal' ? cost + ' 💎' : fmt(cost) + ' 🧬');
    const haveEl = el.querySelector('[data-have]');
    if (haveEl) haveEl.textContent = maxed ? '⭐ МАКС' : (canBuy ? '✓ КУПИТЬ' : '🔒');
    const lvlEl = el.querySelector('[data-lvl]');
    if (lvlEl && lvlText) lvlEl.textContent = lvlText;
  });
}

function updateStats() {
  const cur = getStage();
  document.getElementById('dnaVal').textContent = fmt(S.dna);
  document.getElementById('crystalsVal').textContent = S.crystals;
  document.getElementById('levelVal').textContent = (S.stage + 1);
  let mainEl = document.querySelector('.main-creature');
  if (!mainEl) {
    mainEl = document.createElement('div');
    mainEl.className = 'main-creature';
    mainEl.dataset.stage = '-1';
    document.getElementById('evolutionZone').appendChild(mainEl);
  }
  if (mainEl.dataset.stage !== String(S.stage)) {
    mainEl.dataset.stage = S.stage;
    mainEl.innerHTML = renderCreature(cur.shape, cur.color);
  }
  const scale = creatureScale();
  const baseSize = window.innerWidth < 400 ? 150 : 200;
  mainEl.style.width = (baseSize * scale) + 'px';
  mainEl.style.height = (baseSize * scale) + 'px';
  document.getElementById('creatureName').textContent = WORLDS[cur.world].emoji + ' ' + cur.name;
  const next = nextStage();
  const canEvolve = next.need !== Infinity && evolutionProgress() >= 100;
  const btn = document.getElementById('evolveBtn');
  btn.disabled = !canEvolve;
  btn.classList.toggle('ready', canEvolve);
  document.getElementById('evoInfo').textContent = canEvolve ? '→ ' + next.name : '';
  updateListStates();
}

function updateEvolutionBar() {
  const cur = getStage();
  const next = nextStage();
  const progress = evolutionProgress();
  document.getElementById('evoFill').style.width = progress + '%';
  document.getElementById('stageLabel').textContent = WORLDS[cur.world].emoji + ' ' + cur.name;
  document.getElementById('nextLabel').textContent = next.need === Infinity ? '🏆 ФИНАЛ' : '→ ' + next.name;
  let needInStage = next.need === Infinity ? 0 : next.need;
  if (S.evolutionBonus > 0) needInStage *= (1 - S.evolutionBonus);
  document.getElementById('evoText').textContent =
    next.need === Infinity ? '🏆 ' + fmt(S.totalDna) : fmt(Math.min(S.totalDna, needInStage)) + ' / ' + fmt(needInStage);
  const timerEl = document.getElementById('timerLabel');
  if (next.need === Infinity) timerEl.textContent = '';
  else if (S.timeLeft <= 0) { timerEl.textContent = '💀 Время'; timerEl.style.color = '#ff3b3b'; }
  else { timerEl.textContent = '⏱ ' + Math.ceil(S.timeLeft) + 'с'; timerEl.style.color = S.timeLeft <= 15 ? '#ff3b3b' : '#ff6b6b'; }
}

function showModal(shape, color, title, desc) {
  document.getElementById('mEmoji').innerHTML = '<div style="width:100px;height:100px;margin:0 auto">' + renderCreature(shape, color) + '</div>';
  document.getElementById('mTitle').textContent = title;
  document.getElementById('mDesc').textContent = desc;
  document.getElementById('modal').classList.add('show');
}

let toastTimer = null;
function toast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + (type || '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
}

function startGame() {
  document.getElementById('menu').classList.add('hidden');
  document.getElementById('menu').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  applyWorld(getStage().world);
  updateStats(); updateEvolutionBar(); renderList();
  toast('🌊 Тапай по существу!');
}

function resetProgress() {
  if (!confirm('Сбросить прогресс? Это необратимо.')) return;
  resetGameState();
  writeSave();
  updateStats(); updateEvolutionBar(); renderList();
  toast('🗑 Прогресс сброшен', 'red');
}

/* ============================================================
   МИРЫ
============================================================ */
let currentWorldKey = '';
function applyWorld(worldKey) {
  if (currentWorldKey === worldKey) return;
  currentWorldKey = worldKey;
  S.currentWorld = worldKey;
  const bg = document.getElementById('worldBg');
  bg.className = 'world-bg ' + worldKey;
  bg.innerHTML = '';

  if (worldKey === 'water' || worldKey === 'air') {
    for (let i = 0; i < 3; i++) {
      const ray = document.createElement('div');
      ray.className = 'ray';
      bg.appendChild(ray);
    }
  }
  if (worldKey === 'earth') {
    const farShore = document.createElement('div');
    farShore.style.cssText = 'position:absolute;top:38%;left:0;right:0;height:5%;background:linear-gradient(180deg,rgba(90,140,80,.7) 0%,rgba(60,100,50,.5) 100%);filter:blur(3px)';
    bg.appendChild(farShore);
    const beach = document.createElement('div');
    beach.style.cssText = 'position:absolute;bottom:0;left:0;right:0;height:52%;background:linear-gradient(180deg,#fff8ec 0%,#fde8c8 20%,#f5d5a8 50%,#e0bd85 80%,#c9a06a 100%)';
    bg.appendChild(beach);
    for (let p = 0; p < 3; p++) {
      const palm = document.createElement('div');
      const size = p === 0 ? 1 : (p === 1 ? 0.75 : 0.6);
      const posRight = p === 0 ? '8%' : (p === 1 ? '22%' : '');
      const posLeft = p === 2 ? '6%' : '';
      const flip = p === 2 ? 'scaleX(-1) ' : '';
      palm.style.cssText = `position:absolute;bottom:${p === 0 ? '5%' : (p === 1 ? '8%' : '10%')};right:${posRight};left:${posLeft};width:${200 * size}px;height:${280 * size}px;transform:${flip}scale(${size});transform-origin:bottom center;z-index:${p === 0 ? 3 : 1};pointer-events:none`;
      palm.innerHTML = `<svg viewBox="0 0 200 280" style="width:100%;height:100%;filter:drop-shadow(4px 6px 8px rgba(0,0,0,.35))">
        <defs><linearGradient id="trunkGrad${p}" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#6a4a2a"/><stop offset="30%" stop-color="#a88868"/><stop offset="50%" stop-color="#c8a888"/><stop offset="70%" stop-color="#a88868"/><stop offset="100%" stop-color="#5a3a1a"/></linearGradient></defs>
        <path d="M 95 280 Q 92 200 100 140 Q 108 90 105 40" stroke="url(#trunkGrad${p})" stroke-width="16" fill="none" stroke-linecap="round"/>
        <g transform="translate(105,40)">
          <path d="M 0 0 Q -80 -30 -95 -80 Q -70 -60 -50 -70 Q -60 -50 -40 -55 Q -45 -30 -20 -40 Q -25 -15 0 0 Z" fill="#6aa840" stroke="#2a5010" stroke-width="1"/>
          <path d="M 0 0 Q -30 -60 -70 -95 Q -50 -70 -30 -75 Q -35 -45 -15 -45 Q -15 -20 0 0 Z" fill="#7ab540" stroke="#2a5010" stroke-width="1"/>
          <path d="M 0 0 Q 30 -60 70 -95 Q 50 -70 30 -75 Q 35 -45 15 -45 Q 15 -20 0 0 Z" fill="#7ab540" stroke="#2a5010" stroke-width="1"/>
          <path d="M 0 0 Q 80 -30 95 -80 Q 70 -60 50 -70 Q 60 -50 40 -55 Q 45 -30 20 -40 Q 25 -15 0 0 Z" fill="#6aa840" stroke="#2a5010" stroke-width="1"/>
          <circle cx="-8" cy="-8" r="10" fill="#4a2a10"/>
          <circle cx="8" cy="-6" r="9" fill="#3a1a05"/>
          <circle cx="0" cy="-14" r="8" fill="#5a3a15"/>
        </g>
      </svg>`;
      bg.appendChild(palm);
    }
  }
  if (worldKey === 'city') {
    const buildings = document.createElement('div'); buildings.className = 'city-buildings'; bg.appendChild(buildings);
    const windows = document.createElement('div'); windows.className = 'city-windows'; bg.appendChild(windows);
    const road = document.createElement('div'); road.className = 'city-road'; bg.appendChild(road);
    for (let i = 1; i <= 3; i++) { const lamp = document.createElement('div'); lamp.className = 'lamp l' + i; bg.appendChild(lamp); }
  }

  /* ЛУНА И КОСМОС — фон для киборга */
  if (worldKey === 'moonCosmos') {
    // Звёзды
    const stars = document.createElement('div');
    stars.className = 'stars';
    bg.appendChild(stars);

    // Луна большая
    const moon = document.createElement('div');
    moon.className = 'moon-big';
    bg.appendChild(moon);

    // Кратеры на луне
    const craterPositions = [
      {top:'22%', right:'14%', w:'14px', h:'14px'},
      {top:'15%', right:'8%', w:'8px', h:'8px'},
      {top:'28%', right:'6%', w:'10px', h:'10px'},
      {top:'18%', right:'20%', w:'6px', h:'6px'},
      {top:'30%', right:'16%', w:'8px', h:'8px'},
    ];
    craterPositions.forEach(c => {
      const crater = document.createElement('div');
      crater.className = 'moon-craters';
      crater.style.top = c.top;
      crater.style.right = c.right;
      crater.style.width = c.w;
      crater.style.height = c.h;
      bg.appendChild(crater);
    });

    // Туманность
    const nebula = document.createElement('div');
    nebula.className = 'nebula';
    bg.appendChild(nebula);

    // Маленькая планета
    const planet = document.createElement('div');
    planet.className = 'planet-small';
    bg.appendChild(planet);

    const ring = document.createElement('div');
    ring.className = 'planet-ring';
    bg.appendChild(ring);
  }

  /* ПЛАНЕТА КСЕН */
  if (worldKey === 'alien') {
    const mist = document.createElement('div');
    mist.className = 'alien-mist';
    bg.appendChild(mist);

    const mushrooms = document.createElement('div');
    mushrooms.className = 'alien-mushrooms';
    bg.appendChild(mushrooms);

    const planet = document.createElement('div');
    planet.className = 'alien-planet';
    bg.appendChild(planet);
  }

  /* ТЁМНАЯ ЗОНА */
  if (worldKey === 'boss') {
    const stars = document.createElement('div');
    stars.className = 'boss-stars';
    bg.appendChild(stars);

    const ship = document.createElement('div');
    ship.className = 'boss-ship';
    bg.appendChild(ship);
  }

  if (worldKey === 'water') {
    for (let i = 0; i < 20; i++) {
      const b = document.createElement('div');
      b.className = 'bubble';
      const size = 6 + Math.random() * 20;
      b.style.width = size + 'px'; b.style.height = size + 'px';
      b.style.left = Math.random() * 100 + '%';
      b.style.animationDuration = (8 + Math.random() * 12) + 's';
      b.style.animationDelay = (-Math.random() * 20) + 's';
      bg.appendChild(b);
    }
  }

  const particles = WORLDS[worldKey].particles;
  for (let i = 0; i < 12; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.textContent = particles[Math.floor(Math.random() * particles.length)];
    p.style.left = Math.random() * 100 + '%';
    p.style.animationDuration = (10 + Math.random() * 15) + 's';
    p.style.animationDelay = (-Math.random() * 20) + 's';
    p.style.fontSize = (12 + Math.random() * 14) + 'px';
    bg.appendChild(p);
  }
}

function triggerRandomEvent() {
  const ev = EVENTS[Math.floor(Math.random() * EVENTS.length)];
  const result = ev.action();
  const toastEl = document.getElementById('eventToast');
  toastEl.textContent = ev.emoji + ' ' + ev.text + ' ' + result;
  toastEl.style.borderColor = ev.good ? '#00ff88' : '#ff3b3b';
  toastEl.style.color = ev.good ? '#00ff88' : '#ff3b3b';
  toastEl.classList.add('show');
  setTimeout(() => toastEl.classList.remove('show'), 2500);
  updateStats(); updateEvolutionBar();
}

function tickTimer() {
  const next = nextStage();
  if (next.need === Infinity) return;
  if (S.timeLeft > 0) {
    S.timeLeft -= 1;
    if (S.timeLeft <= 0) {
      S.timeLeft = 0;
      const lost = Math.floor(S.totalDna * 0.3);
      S.totalDna = Math.max(0, S.totalDna - lost);
      S.dna = Math.max(0, S.dna - lost);
      S.timeLeft = getStage().time + permExtraTime();
      toast('💀 Время вышло! -' + fmt(lost) + ' ДНК', 'red');
    }
    updateEvolutionBar();
  }
}

document.addEventListener('click', (e) => {
  const actionEl = e.target.closest('[data-action]');
  if (actionEl) {
    const action = actionEl.dataset.action;
    if (action === 'buy-mutation') buyMutation(actionEl.dataset.id);
    else if (action === 'buy-generator') buyGenerator(actionEl.dataset.id);
    else if (action === 'watch-ad') watchAd();
    else if (action === 'evolve') askEvolve();
    else if (action === 'start') startGame();
    else if (action === 'reset') resetProgress();
    else if (action === 'close-modal') document.getElementById('modal').classList.remove('show');
    return;
  }
  const buyEl = e.target.closest('[data-buy]');
  if (buyEl && !buyEl.classList.contains('locked') && !buyEl.classList.contains('maxed')) {
    const [type, id] = buyEl.dataset.buy.split(':');
    if (type === 'mut') buyMutation(id);
    else if (type === 'gen') buyGenerator(id);
    else if (type === 'crystal') buyCrystalBonus(id);
    return;
  }
  const tabEl = e.target.closest('.tab');
  if (tabEl) { switchTab(tabEl.dataset.tab); return; }
});

document.getElementById('evolutionZone').addEventListener('click', (e) => {
  if (e.target.closest('[data-action]') || e.target.closest('[data-buy]')) return;
  doClick(e.clientX, e.clientY);
});
document.getElementById('evolutionZone').addEventListener('touchstart', (e) => {
  if (e.target.closest('[data-action]') || e.target.closest('[data-buy]')) return;
  e.preventDefault();
  const t = e.touches[0];
  doClick(t.clientX, t.clientY);
}, {passive: false});

let saveTimeout = null;
function scheduleSave() {
  if (saveTimeout) return;
  saveTimeout = setTimeout(() => {
    saveTimeout = null;
    writeSave();
  }, 2000);
}

setInterval(() => {
  const income = cps() / 10;
  if (income > 0) {
    S.dna += income;
    S.totalDna += income;
    updateStats(); updateEvolutionBar();
  }
}, 100);
setInterval(tickTimer, 1000);
setInterval(triggerRandomEvent, 25000);
setInterval(writeSave, 5000);
setInterval(() => { S.lastOnline = Date.now(); }, 10000);

window.addEventListener('beforeunload', () => {
  S.lastOnline = Date.now();
  writeSave();
});

window.addEventListener('resize', updateStats);

loadSave();
updateStats();
updateEvolutionBar();
renderList();
applyWorld(getStage().world);
</script>
</body>
</html>
